spring.application.name=imobiliariasystem

#Conexão com o env
spring.config.import=optional:file:.env[.properties]

# URL de conexão com o BD
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false

# Credenciais de acesso
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuração do Hibernate DDL-auto
spring.jpa.hibernate.ddl-auto=validate

# Opcional: exibir comandos SQL no console
spring.jpa.show-sql=true

# Paginação: limite de itens por página, mesmo que o cliente peça mais (?size=1000)
spring.data.web.pageable.max-page-size=20