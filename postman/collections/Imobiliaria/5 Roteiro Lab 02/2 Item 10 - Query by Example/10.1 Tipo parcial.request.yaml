$kind: http-request
method: GET
url: '{{baseUrl}}/imoveis/busca?tipo=apart'
order: 1000
queryParams:
  - key: tipo
    value: 'apart'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Ids 1, 4, 8", () => pm.expect(pm.response.json().content.map(i => i.id)).to.eql([1, 4, 8]));
