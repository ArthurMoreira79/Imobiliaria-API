$kind: http-request
method: GET
url: '{{baseUrl}}/imoveis/busca'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("8 imóveis", () => pm.expect(pm.response.json().page.totalElements).to.eql(8));
