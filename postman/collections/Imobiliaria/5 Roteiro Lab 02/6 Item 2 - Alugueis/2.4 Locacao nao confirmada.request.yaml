$kind: http-request
method: POST
url: '{{baseUrl}}/alugueis'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "locacao": {
        "id": 4
      },
      "dt_vencimento": "2026-11-05"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
      pm.test("Mensagem contém: não está confirmada", () => pm.expect(pm.response.json().mensagem).to.include("não está confirmada"));
