$kind: http-request
method: POST
url: '{{baseUrl}}/alugueis'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "locacao": {},
      "dt_vencimento": "2026-11-05",
      "valor_pago": -1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("Campos locacao.id e valor_pago", () => pm.expect(pm.response.json().campos.map(c => c.nome).sort()).to.eql(["locacao.id","valor_pago"]));
