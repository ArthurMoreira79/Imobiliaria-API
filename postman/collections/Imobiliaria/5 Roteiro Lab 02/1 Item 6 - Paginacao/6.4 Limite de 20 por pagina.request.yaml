$kind: http-request
method: GET
url: '{{baseUrl}}/imoveis/paginado?size=500'
order: 4000
queryParams:
  - key: size
    value: '500'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("size limitado a 20", () => pm.expect(pm.response.json().page.size).to.eql(20));
