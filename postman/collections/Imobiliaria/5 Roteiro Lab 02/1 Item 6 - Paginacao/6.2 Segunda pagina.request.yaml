$kind: http-request
method: GET
url: '{{baseUrl}}/imoveis/paginado?page=1'
order: 2000
queryParams:
  - key: page
    value: '1'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Ids 6, 7, 8", () => pm.expect(pm.response.json().content.map(i => i.id)).to.eql([6, 7, 8]));
