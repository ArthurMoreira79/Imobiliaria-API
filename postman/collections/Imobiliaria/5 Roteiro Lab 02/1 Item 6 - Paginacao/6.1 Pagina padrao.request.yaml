$kind: http-request
method: GET
url: '{{baseUrl}}/imoveis/paginado'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Ids 1, 2, 3, 4, 5", () => pm.expect(pm.response.json().content.map(i => i.id)).to.eql([1, 2, 3, 4, 5]));
      pm.test("Bloco page", () => pm.expect(pm.response.json().page).to.eql({"size":5,"number":0,"totalElements":8,"totalPages":2}));
