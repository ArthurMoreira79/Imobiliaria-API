$kind: http-request
method: DELETE
url: '{{baseUrl}}/imoveis/7'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
      pm.test("Mensagem contém: em andamento ou futura", () => pm.expect(pm.response.json().mensagem).to.include("em andamento ou futura"));
