$kind: http-request
method: PUT
url: '{{baseUrl}}/locacoes/2/cancelar'
order: 10000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
      pm.test("Mensagem contém: já está cancelada", () => pm.expect(pm.response.json().mensagem).to.include("já está cancelada"));
