$kind: http-request
method: POST
url: '{{baseUrl}}/locacoes'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "inquilino": {
        "id": 3
      },
      "imovel": {
        "id": 2
      },
      "data_inicio": "2026-11-01",
      "data_fim": "2026-11-10",
      "dia_vencimento": 10
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
