$kind: http-request
method: POST
url: '{{baseUrl}}/locacoes'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "inquilino": {
        "id": 3
      },
      "imovel": {
        "id": 2
      },
      "data_inicio": "2026-12-31",
      "data_fim": "2027-01-05",
      "dia_vencimento": 10
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      pm.test("Locação 7", () => pm.expect(pm.response.json().id).to.eql(7));
