$kind: http-request
method: PUT
url: '{{baseUrl}}/locacoes/9/confirmar'
order: 8000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Confirmada", () => pm.expect(pm.response.json().ativo).to.eql(true));
