$kind: http-request
method: PUT
url: '{{baseUrl}}/locacoes/9/confirmar'
order: 9000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
      pm.test("Mensagem contém: já está confirmada", () => pm.expect(pm.response.json().mensagem).to.include("já está confirmada"));
