$kind: http-request
method: POST
url: '{{baseUrl}}/locacoes'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "inquilino": {
        "id": 1
      },
      "imovel": {
        "id": 3
      },
      "data_inicio": "2026-11-01",
      "data_fim": "2026-11-01",
      "dia_vencimento": 10
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
      pm.test("Mensagem contém: deve ser posterior", () => pm.expect(pm.response.json().mensagem).to.include("deve ser posterior"));
