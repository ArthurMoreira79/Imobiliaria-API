$kind: http-request
method: GET
url: '{{baseUrl}}/locacoes/1'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Inquilino completo", () => pm.expect(pm.response.json().inquilino.nome_cliente).to.eql("Ana Beatriz Souza"));
