$kind: collection
description: "API REST da imobiliária (Labs 01, 02 e 03 de Desenvolvimento Web II). Antes do roteiro, recrie o banco para os ids baterem. Desde o Lab 03 a API exige HTTP Basic: a coleção usa o admin por padrão, e as requisições do roteiro do Lab 03 informam o próprio usuário. As senhas abaixo são só dos usuários de teste da migration V12."
variables:
  baseUrl: http://localhost:8080
  idClienteDto: ""
  senhaTeste: ""
  idImovelLab03: ""
  idLocacaoAna: ""
  idAdmin: ""
  idUsuarioCarla: ""
  senhaCarla: ""
auth:
  type: basic
  credentials:
    username: admin
    password: "{{senhaTeste}}"
