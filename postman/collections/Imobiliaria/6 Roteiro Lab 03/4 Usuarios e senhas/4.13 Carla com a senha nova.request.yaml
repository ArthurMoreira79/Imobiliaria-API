$kind: http-request
method: GET
url: '{{baseUrl}}/locacoes'
order: 13000
auth:
  type: basic
  credentials:
    - key: username
      value: 'carla'
    - key: password
      value: '{{senhaCarlaNova}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
