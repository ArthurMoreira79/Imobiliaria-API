$kind: http-request
method: POST
url: '{{baseUrl}}/usuarios'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "login": "ana2",
      "senha": "teste123",
      "perfis": [
        "CLIENTE"
      ],
      "cliente": {
        "id": 1
      }
    }
auth:
  type: basic
  credentials:
    - key: username
      value: 'admin'
    - key: password
      value: '{{senhaTeste}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
      pm.test("Mensagem", () => pm.expect(pm.response.json().mensagem).to.include("já possui um usuário"));
