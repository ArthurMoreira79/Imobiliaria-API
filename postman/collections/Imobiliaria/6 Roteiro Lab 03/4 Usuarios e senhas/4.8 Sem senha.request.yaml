$kind: http-request
method: POST
url: '{{baseUrl}}/usuarios'
order: 8000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "login": "semsenha",
      "perfis": [
        "ATENDENTE"
      ]
    }
auth:
  type: basic
  credentials:
    - key: username
      value: 'admin'
    - key: password
      value: '{{senhaTeste}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("Campo senha", () => pm.expect(pm.response.json().campos.map(c => c.nome)).to.eql(["senha"]));
