$kind: http-request
method: GET
url: '{{baseUrl}}/usuarios'
order: 1000
auth:
  type: basic
  credentials:
    - key: username
      value: 'admin'
    - key: password
      value: '{{senhaTeste}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Resposta sem senha nem hash", () => {
        pm.expect(pm.response.text()).to.not.include("senha");
        pm.expect(pm.response.text()).to.not.include("$2a$");
      });
      pm.test("Usuários da V12", () => {
        const logins = pm.response.json().map(u => u.login);
        pm.expect(logins).to.include.members(["admin", "atendente", "ana", "bruno"]);
      });
      pm.collectionVariables.set("idAdmin", pm.response.json().find(u => u.login === "admin").id);
