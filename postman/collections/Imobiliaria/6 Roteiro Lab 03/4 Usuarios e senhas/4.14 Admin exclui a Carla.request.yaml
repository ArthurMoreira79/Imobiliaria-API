$kind: http-request
method: DELETE
url: '{{baseUrl}}/usuarios/{{idUsuarioCarla}}'
order: 14000
auth:
  type: basic
  credentials:
    - key: username
      value: 'admin'
    - key: password
      value: '{{senhaTeste}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 204", () => pm.response.to.have.status(204));
