$kind: http-request
method: GET
url: '{{baseUrl}}/clientes/1'
order: 2000
auth:
  type: basic
  credentials:
    - key: username
      value: 'atendente'
    - key: password
      value: '{{senhaTeste}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Ainda é a Ana", () => pm.expect(pm.response.json().nome_cliente).to.eql("Ana Beatriz Souza"));
