$kind: http-request
method: POST
url: '{{baseUrl}}/imoveis'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "tipo_imovel": "Casa",
      "endereco": "Rua do Teste Lab 03, 1, Centro",
      "cep": "65000000",
      "cidade": "São Luís",
      "dormitorios": 2,
      "banheiros": 1,
      "suites": 0,
      "metragem": 60,
      "valor_diaria": 100,
      "valor_aluguel_sug": null,
      "obs": null
    }
auth:
  type: basic
  credentials:
    - key: username
      value: 'atendente'
    - key: password
      value: '{{senhaTeste}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("idImovelLab03", pm.response.json().id);
