$kind: http-request
method: GET
url: '{{baseUrl}}/imoveis'
order: 1000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 401", () => pm.response.to.have.status(401));
      pm.test("JSON de erro: Não autenticado", () => pm.expect(pm.response.json().titulo).to.eql("Não autenticado"));
      pm.test("Header WWW-Authenticate", () => pm.expect(pm.response.headers.get("WWW-Authenticate")).to.include("Basic"));
