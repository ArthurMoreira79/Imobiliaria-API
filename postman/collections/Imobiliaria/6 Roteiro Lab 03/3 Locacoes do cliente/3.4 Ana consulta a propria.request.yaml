$kind: http-request
method: GET
url: '{{baseUrl}}/locacoes/1'
order: 4000
auth:
  type: basic
  credentials:
    - key: username
      value: 'ana'
    - key: password
      value: '{{senhaTeste}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Inquilino é a Ana", () => pm.expect(pm.response.json().inquilino.id).to.eql(1));
