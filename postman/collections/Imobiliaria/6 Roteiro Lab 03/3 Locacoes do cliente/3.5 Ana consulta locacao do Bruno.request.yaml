$kind: http-request
method: GET
url: '{{baseUrl}}/locacoes/2'
order: 5000
auth:
  type: basic
  credentials:
    - key: username
      value: 'ana'
    - key: password
      value: '{{senhaTeste}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 403", () => pm.response.to.have.status(403));
      pm.test("JSON de erro: Acesso negado", () => pm.expect(pm.response.json().titulo).to.eql("Acesso negado"));
      pm.test("Mensagem", () => pm.expect(pm.response.json().mensagem).to.include("suas próprias locações"));
